[package]
name = "labdeck"
version = "0.5.3"
edition = "2024"

[dependencies]
ab_glyph = "0.2.32"
arboard = { version = "3.7.0", default-features = false }
chrono = "0.4.45"
eframe = { version = "0.37.0", default-features = false, features = ["default_fonts", "glow", "wayland", "x11", "clipboard", "accesskit"] }
egui = { version = "0.37.0", default-features = false }
enigo = "0.6.1"
epaint_default_fonts = "0.37.0"
hidapi = "2.6.7"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "ico", "gif", "webp", "bmp"] }
mlua = { version = "0.10", features = ["lua54", "vendored", "serialize"] }
tungstenite = { version = "0.26", default-features = false, features = ["handshake"] }
mouse_position = "0.1.4"
open = "5.4.5"
rodio = "0.23.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tray-icon = { version = "0.26.1", default-features = false, features = ["ksni"] }
ureq = "3.5.1"
zip = { version = "9.2.2", default-features = false, features = ["deflate"] }

# macOS: a check's window opens without pulling LabDeck to the front (the same winit eframe uses).
[target.'cfg(target_os = "macos")'.dependencies]
winit = { version = "0.30", default-features = false }
